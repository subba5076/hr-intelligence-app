# Exposes the frontend (and proxies /api to the backend) to the internet
# through AKS's ingress controller (e.g. NGINX ingress or Azure
# Application Gateway Ingress Controller -- either works with this spec).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrapp-ingress
  namespace: hr-intelligence
  annotations:
    nginx.ingress.controller.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - hrapp.example.com
      secretName: hrapp-tls
  rules:
    - host: hrapp.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

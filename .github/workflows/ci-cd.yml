# CI/CD pipeline: "automated tests, container builds, and rolling
# deployment on every push to main" (per the resume).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   AZURE_CREDENTIALS   - output of `az ad sp create-for-rbac --sdk-auth`
#   ACR_LOGIN_SERVER     - e.g. hrappregistry.azurecr.io
#   ACR_USERNAME / ACR_PASSWORD  - from `az acr credential show`
#   AKS_CLUSTER_NAME      - your AKS cluster name
#   AKS_RESOURCE_GROUP    - resource group containing the cluster
#
# Until those secrets exist, the "test" job still runs on every PR/push
# (useful on its own); the "build-and-deploy" job only runs on pushes to
# main and will simply fail fast with a clear error if secrets are missing.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Backend: lint + test ----
  backend-test:
    runs-on: ubuntu-latest
    # Real Postgres service container, so tests run against the same
    # database engine as production (docker-compose/AKS both use Postgres)
    # rather than only against the SQLite fallback used for quick local
    # test runs -- see backend/tests/conftest.py.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrapp
          POSTGRES_PASSWORD: hrapp_password
          POSTGRES_DB: hrapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hrapp:hrapp_password@localhost:5432/hrapp
      LLM_PROVIDER: mock
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v

  # ---- Frontend: lint + typecheck + build ----
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

  # ---- Build & push images, then rolling-deploy to AKS ----
  build-and-deploy:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/hrapp-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/hrapp-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/hrapp-frontend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/hrapp-frontend:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/backend-hpa.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          # secret.yaml is created once manually (kubectl apply -f k8s/secret.yaml)
          # and is intentionally NOT applied here since it isn't committed to git.

      - name: Roll out the new image tags (rolling update)
        run: |
          kubectl set image deployment/backend backend=${{ secrets.ACR_LOGIN_SERVER }}/hrapp-backend:${{ github.sha }} -n hr-intelligence
          kubectl set image deployment/frontend frontend=${{ secrets.ACR_LOGIN_SERVER }}/hrapp-frontend:${{ github.sha }} -n hr-intelligence
          kubectl rollout status deployment/backend -n hr-intelligence
          kubectl rollout status deployment/frontend -n hr-intelligence

# Serves the built React app and proxies API calls to the backend Service.
# In Kubernetes, "backend" resolves via the Service DNS name
# (see k8s/backend-service.yaml); in docker-compose, it resolves via the
# service name defined there.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path falls back to index.html so
    # client-side routing (if added later) keeps working on refresh.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/ {
        proxy_pass http://backend:8000/health/;
    }
}
